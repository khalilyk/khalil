# Render Blueprint — runs Khalil as a normal Node server (next start),
# which serves the standard .next build correctly (unlike Vercel's
# serverless transform, which doesn't support this Next fork).
#
# Setup: render.com → New → Blueprint → connect the khalilyk/khalil repo.
# Render reads this file, then prompts you to fill in the env var values
# (copy them from your local .env.local).
services:
  - type: web
    name: khalil
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && node node_modules/next/dist/bin/next build
    startCommand: node node_modules/next/dist/bin/next start -p $PORT
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: PP_SUPABASE_URL
        sync: false
      - key: PP_SUPABASE_KEY
        sync: false
      - key: NN_POSTGRES_URL
        sync: false
